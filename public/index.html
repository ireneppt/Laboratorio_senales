<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de señales</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
    #chart { width: 100%; height: 420px; }
  </style>
</head>
<body>
  <h1>Laboratorio de señales</h1>
  <div id="chart"></div>
  <script>
    fetch("/api/series")
      .then((r) => r.json())
      .then(({ x, y }) => {
        Plotly.newPlot("chart", [{ x, y, mode: "lines", name: "serie" }], {
          margin: { t: 20 },
          xaxis: { title: "t" },
          yaxis: { title: "valor" },
        }, { responsive: true });
      });
  </script>
</body>
</html>
